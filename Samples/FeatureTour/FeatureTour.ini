; FeatureTour configuration (copied next to the exe on build)
; If this file is missing, FeatureTour recreates it with these same values (see addDefaultConfig()).
; Comments must be on their own line.

[Logging]
; STACK, DEBUG, INFO, WARN, ERROR or NONE (any case).
; DEBUG also logs the command line, every setting in effect and where the greeted name came from.
log_level = DEBUG

[Greeter]
; Used when -name isn't given on the command line
name = World
; Whole number >= 1; an invalid value is logged as a warning and 1 is used
repeat = 2

; Every section starting with "Task." is a task.
; enabled: true/false, yes/no, on/off or 1/0 (an invalid value skips the task with a warning)
[Task.Backup]
enabled = true
message = Backing up files...

[Task.Cleanup]
enabled = false
message = Cleaning temp files...

[Task.Report]
enabled = true
message = Generating report...
